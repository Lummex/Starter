name: Secret scan

# Every push and pull request, every branch: refuses keys in the code (Supabase secret keys, Stripe keys,
# service_role in browser code). Shows a red X; GitHub's own Push protection (Settings → Advanced Security)
# is what actually blocks the push. Also makes sure the factory's own scripts still parse.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Factory scripts parse
        run: for f in factory/scripts/*.mjs; do node --check "$f"; done
      - name: Secret scan self-test
        run: node factory/scripts/secret-scan.test.mjs
      - name: Secret scan
        run: node factory/scripts/secret-scan.mjs
