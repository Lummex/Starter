name: Copy game models into the game

# Started by hand. Moves ready-to-use (already shrunk) models from factory-design/models-game/<id>.glb + <id>.json on main
# into <app>/public/models/creatures/<id>/char.glb + models.json on the chosen branch, then clears the staging folder on main.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Game branch'
        required: true
        default: 'factory/issue-8'
      app:
        description: 'App folder'
        required: true
        default: 'projects/oreheart-8'

permissions:
  contents: write

jobs:
  copy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          path: game
      - name: Copy the models
        env:
          APP: ${{ github.event.inputs.app }}
        run: |
          set -e
          n=0
          for f in main/factory-design/models-game/*.glb; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .glb)
            d="game/$APP/public/models/creatures/$id"
            mkdir -p "$d"
            cp "$f" "$d/char.glb"
            [ -f "main/factory-design/models-game/$id.json" ] && cp "main/factory-design/models-game/$id.json" "$d/models.json"
            n=$((n+1)); echo "copied $id"
          done
          echo "copied $n models"
          cd game
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add "$APP/public/models/creatures"
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Game models: $n Gnome and Dwarf models (character only, textures shrunk to 1024)"
          git push
      - name: Clear the staging folder on main
        run: |
          cd main
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git rm -r -q --ignore-unmatch factory-design/models-game
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clear models-game staging (copied into the game)"
          git push
