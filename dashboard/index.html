<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Software Factory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5d50'/><path d='M7 24V14l6 4v-4l6 4v-8h6v14z' fill='white'/></svg>">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --text: #1d1f1e; --muted: #626866;
  --border: #dddad0; --accent: #2f5d50; --accent-text: #ffffff; --accent-soft: #e2ece8;
  --good: #22704a; --good-soft: #e1f1e7; --warn: #8a5a00; --warn-soft: #fbefd6;
  --bad: #a53a2c; --bad-soft: #f8e3df; --info: #2b5b8a; --info-soft: #e1ebf5;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141615; --surface: #1c1f1e; --surface-2: #252928; --text: #ecefed; --muted: #a0a8a4;
    --border: #323735; --accent: #7fc0a9; --accent-text: #0f1a16; --accent-soft: #1f3530;
    --good: #7fd3a3; --good-soft: #1b3326; --warn: #f0c46b; --warn-soft: #3a2f17;
    --bad: #f19a8c; --bad-soft: #3d221e; --info: #8ab8e6; --info-soft: #1c2d3e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 4px; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 28px 0 10px; }
.sub { color: var(--muted); margin: 0 0 20px; }
button, .btn { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.good { background: var(--good); border-color: var(--good); color: var(--bg); }
button:disabled { opacity: .55; cursor: wait; }
button.link { border: none; background: none; color: var(--muted); padding: 6px 4px; min-height: 0; font-weight: 500; }
input, textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
textarea { min-height: 180px; resize: vertical; }
input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
.hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; text-decoration: none; color: inherit; }
.item:hover { border-color: var(--muted); }
.item .t { font-weight: 650; font-size: 17px; }
.item .meta { color: var(--muted); font-size: 14px; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.busy .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.s-info { background: var(--info-soft); color: var(--info); }
.s-warn { background: var(--warn-soft); color: var(--warn); }
.s-good { background: var(--good-soft); color: var(--good); }
.s-bad { background: var(--bad-soft); color: var(--bad); }
.s-accent { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.banner { border-radius: var(--radius); padding: 16px 18px; margin: 16px 0; border: 1px solid transparent; }
.banner.s-good { border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.banner.s-warn { border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.s-bad { border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.banner.s-info { border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.banner p { margin: 4px 0 0; color: var(--text); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.steps { display: flex; gap: 6px; margin: 18px 0 6px; }
.steps div { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.steps div.on { background: var(--accent); }
.steplabels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.timeline { display: grid; gap: 12px; }
.entry { padding: 14px 16px; }
.entry.owner { background: var(--surface-2); border-color: transparent; box-shadow: none; }
.entry .who { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.md h2, .md h3 { font-size: 16px; margin: 16px 0 6px; }
.md p { margin: 6px 0; }
.md ul { margin: 6px 0; padding-left: 22px; }
.md pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.md code { font-size: .92em; }
.md sub { color: var(--muted); }
.md { overflow-wrap: anywhere; }
.err { color: var(--bad); font-weight: 600; margin-top: 10px; }
.login { max-width: 380px; margin: 12vh auto 0; }
.back { display: inline-flex; margin: 4px 0 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; }
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); width: min(560px, calc(100vw - 32px)); padding: 20px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
@media (max-width: 520px) { h1 { font-size: 22px; } .actions > * { flex: 1 1 100%; justify-content: center; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 24V14l6 4v-4l6 4v-8h6v14z" fill="var(--accent-text)"/></svg>
      Software Factory
    </a>
    <div id="hdr-actions"></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title" style="margin-top:0"></h2>
    <p class="sub" id="dlg-sub"></p>
    <textarea id="dlg-text" style="min-height:140px"></textarea>
    <div class="err" id="dlg-err" hidden></div>
    <div class="actions">
      <button type="submit" class="primary" id="dlg-ok">Send</button>
      <button type="button" id="dlg-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
let timer = null;

const STATUS = {
  'new':        { label: 'Queued',              cls: 's-info', busy: true,  step: 0 },
  'building':   { label: 'Building',            cls: 's-info', busy: true,  step: 1 },
  'revise':     { label: 'Queued for changes',  cls: 's-info', busy: true,  step: 1 },
  'needs-info': { label: 'Needs your answers',  cls: 's-warn', busy: false, step: 1 },
  'review':     { label: 'Ready for review',    cls: 's-accent', busy: false, step: 2 },
  'approved':   { label: 'Shipping',            cls: 's-info', busy: true,  step: 3 },
  'shipping':   { label: 'Shipping',            cls: 's-info', busy: true,  step: 3 },
  'shipped':    { label: 'Live',                cls: 's-good', busy: false, step: 4 },
  'failed':     { label: 'Stopped',             cls: 's-bad',  busy: false, step: 1 },
};
const st = (s) => STATUS[s] || STATUS['new'];
const pill = (s) => `<span class="pill ${st(s).cls} ${st(s).busy ? 'busy' : ''}"><span class="dot"></span>${st(s).label}</span>`;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function safeUrl(u) { return /^https:\/\//.test(u || '') ? u : null; }

// Small, safe markdown renderer (escapes everything first).
function md(src) {
  const blocks = []; let text = esc(src || '');
  text = text.replace(/```[a-z]*\n?([\s\S]*?)```/g, (_, code) => { blocks.push(`<pre><code>${code}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (s) => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/&lt;sub&gt;([\s\S]*?)&lt;\/sub&gt;/g, '<sub>$1</sub>');
  const out = []; let list = null;
  for (const line of text.split('\n')) {
    const li = /^\s*[-*]\s+(.*)/.exec(line);
    if (li) { (list ||= []).push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    const h = /^(#{1,4})\s+(.*)/.exec(line);
    if (h) out.push(`<h3>${inline(h[2])}</h3>`);
    else if (/^\u0000\d+\u0000$/.test(line.trim())) out.push(line.trim());
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.includes('login')) { location.hash = '#/login'; throw new Error('Please log in.'); }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function setHeader(html) { $('#hdr-actions').innerHTML = html; }
function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }

// ---------- Views ----------
function viewLogin() {
  setHeader('');
  app.innerHTML = `
    <form class="card login" id="f">
      <h1>Welcome back</h1>
      <p class="sub">Enter your factory password.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <div class="err" id="e" hidden></div>
      <div class="actions"><button class="primary" type="submit">Log in</button></div>
    </form>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    const b = ev.submitter; b.disabled = true;
    try { await api('/api/login', { method: 'POST', body: { password: $('#pw').value } }); location.hash = '#/'; }
    catch (e) { $('#e').hidden = false; $('#e').textContent = e.message; b.disabled = false; }
  };
}

async function viewHome() {
  setHeader(`<a class="btn primary" href="#/new">＋ New idea</a>`);
  if (!app.dataset.view?.startsWith('home')) app.innerHTML = `<p class="sub">Loading…</p>`;
  app.dataset.view = 'home';
  let data;
  try { data = await api('/api/projects'); } catch (e) { app.innerHTML = `<div class="banner s-bad"><strong>Couldn't load projects</strong><p>${esc(e.message)}</p></div>`; return; }
  const ps = data.projects;
  const needsYou = ps.filter((p) => ['review', 'needs-info', 'failed'].includes(p.status));
  const row = (p) => `
    <a class="card item" href="#/p/${p.number}">
      <span class="t">${esc(p.title)}</span>${pill(p.status)}
      <span class="meta">
        <span>#${p.number}</span><span>Updated ${ago(p.updated)}</span>
        ${p.total != null ? `<span>${p.passed}/${p.total} checks passed</span>` : ''}
        ${p.live ? `<span>Live ↗</span>` : ''}
      </span>
    </a>`;
  app.innerHTML = ps.length === 0 ? `
    <div class="card empty">
      <strong>Your factory is ready.</strong>
      Describe a website or web app in plain English, and the agents will plan it, build it, test it and bring you a preview to approve.
      <div class="actions" style="justify-content:center"><a class="btn primary" href="#/new">＋ Start your first idea</a></div>
    </div>` : `
    ${needsYou.length ? `<h2>Waiting on you</h2><div class="list">${needsYou.map(row).join('')}</div>` : ''}
    <h2>${needsYou.length ? 'Everything else' : 'Projects'}</h2>
    <div class="list">${ps.filter((p) => !needsYou.includes(p)).map(row).join('') || '<p class="sub">Nothing else right now.</p>'}</div>`;
  if (ps.some((p) => st(p.status).busy)) schedule(viewHome, 20000);
}

function viewNew() {
  setHeader('');
  app.dataset.view = 'new';
  app.innerHTML = `
    <a class="back" href="#/">← All projects</a>
    <h1>New idea</h1>
    <p class="sub">Describe it the way you'd explain it to a friend. The more detail, the better — who it's for, what pages it needs, what people can do on it, and the look you want.</p>
    <form class="card" id="f">
      <label for="title">Name</label>
      <input id="title" maxlength="120" placeholder="e.g. Booking site for my dog-walking business" required>
      <label for="desc">Description</label>
      <textarea id="desc" required placeholder="e.g. A friendly, simple website for Happy Paws dog walking in Portland. Home page with my services and prices (30-min walk $20, 60-min walk $35). A booking form where people pick a date, time, dog's name and their phone number. Show a thank-you message after booking. Warm colors, big photos of dogs, works well on phones."></textarea>
      <p class="hint">Version 1 builds websites that run in the browser. It can't yet do user logins, payments, or sending emails — the planner will build the closest version and tell you what it left out.</p>
      <div class="err" id="e" hidden></div>
      <div class="actions"><button class="primary" type="submit">Send to the factory</button></div>
    </form>`;
  $('#f').onsubmit = async (ev) => {
    ev.preventDefault();
    const b = ev.submitter; b.disabled = true; b.textContent = 'Sending…';
    try {
      const r = await api('/api/projects', { method: 'POST', body: { title: $('#title').value, description: $('#desc').value } });
      location.hash = `#/p/${r.number}`;
    } catch (e) { $('#e').hidden = false; $('#e').textContent = e.message; b.disabled = false; b.textContent = 'Send to the factory'; }
  };
}

async function viewProject(n) {
  setHeader('');
  if (app.dataset.view !== `p${n}`) app.innerHTML = `<a class="back" href="#/">← All projects</a><p class="sub">Loading…</p>`;
  app.dataset.view = `p${n}`;
  let p;
  try { p = await api(`/api/project?n=${n}`); } catch (e) { app.innerHTML = `<a class="back" href="#/">← All projects</a><div class="banner s-bad"><strong>Couldn't load this project</strong><p>${esc(e.message)}</p></div>`; return; }
  if (location.hash !== `#/p/${n}`) return;
  const s = p.status; const preview = safeUrl(p.preview); const live = safeUrl(p.live); const run = safeUrl(p.run);
  const step = st(s).step;
  let banner = '';
  if (s === 'new' || s === 'revise') banner = `<div class="banner s-info"><strong>In the queue</strong><p>The factory will start in a moment.</p></div>`;
  if (s === 'building') banner = `<div class="banner s-info"><strong>The agents are working on it</strong><p>Planning, building and testing usually takes 10–30 minutes. This page updates by itself.${run ? ` <a href="${run}" target="_blank" rel="noopener">Watch the live log</a>.` : ''}</p></div>`;
  if (s === 'needs-info') banner = `<div class="banner s-warn"><strong>The planner has questions for you</strong><p>See the questions below, then answer them so the factory can continue.</p><div class="actions"><button class="primary" data-act="answer">Answer questions</button></div></div>`;
  if (s === 'review') {
    const ok = p.report && p.report.total > 0 && p.report.passed === p.report.total;
    banner = `<div class="banner ${ok ? 's-good' : 's-warn'}"><strong>${ok ? 'Ready for your review' : 'Ready for review — some checks failed'}</strong>
      <p>${preview ? 'Open the preview, click around, and read the report below. Approve to put it live, or ask for changes.' : 'The site did not build, so there is no preview. Ask for changes to try again.'}</p>
      <div class="actions">
        ${preview ? `<a class="btn primary" href="${preview}" target="_blank" rel="noopener">Open preview ↗</a>` : ''}
        ${preview ? `<button class="good" data-act="approve">✓ Approve &amp; launch</button>` : ''}
        <button data-act="revise">Request changes</button>
      </div></div>`;
  }
  if (s === 'approved' || s === 'shipping') banner = `<div class="banner s-info"><strong>Launching…</strong><p>Putting your approved build live. This takes a minute or two.</p></div>`;
  if (s === 'shipped') banner = `<div class="banner s-good"><strong>It's live!</strong><p>${live ? `<a href="${live}" target="_blank" rel="noopener">${esc(live)}</a>` : ''}</p>
      <div class="actions">${live ? `<a class="btn primary" href="${live}" target="_blank" rel="noopener">Visit site ↗</a>` : ''}<button data-act="revise">Make changes</button></div></div>`;
  if (s === 'failed') banner = `<div class="banner s-bad"><strong>The factory stopped</strong><p>Something went wrong — details are below. You can try again, or add instructions.</p>
      <div class="actions"><button class="primary" data-act="retry">Try again</button><button data-act="revise">Try again with notes</button></div></div>`;

  const names = ['Queued', 'Building', 'Review', 'Launching', 'Live'];
  app.innerHTML = `
    <a class="back" href="#/">← All projects</a>
    <div class="toprow"><h1>${esc(p.title)}</h1>${pill(s)}</div>
    <div class="steps" aria-hidden="true">${names.map((_, i) => `<div class="${i <= step ? 'on' : ''}"></div>`).join('')}</div>
    <div class="steplabels" aria-hidden="true">${names.map((x) => `<span>${x}</span>`).join('')}</div>
    ${banner}
    <h2>Your request</h2>
    <div class="card md">${md(p.description)}</div>
    <h2>History</h2>
    <div class="timeline">
      ${p.timeline.slice().reverse().map((c) => `
        <div class="card entry ${c.fromFactory ? '' : 'owner'}">
          <div class="who">${c.fromFactory ? '🏭 Factory' : '🙂 You'} · ${ago(c.at)}</div>
          <div class="md">${md(c.body)}</div>
        </div>`).join('') || '<p class="sub">Nothing yet.</p>'}
    </div>
    <p class="hint" style="margin-top:24px"><a href="${safeUrl(p.githubUrl) || '#'}" target="_blank" rel="noopener">View on GitHub</a></p>`;

  app.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(n, b.dataset.act, b));
  if (st(s).busy) schedule(() => viewProject(n), 15000);
}

async function act(n, action, btn) {
  if (action === 'approve') {
    if (!confirm('Launch this build? It will go live on the internet.')) return;
    return send(n, 'approve', '', btn);
  }
  if (action === 'retry') return send(n, 'retry', '', btn);
  const copy = {
    revise: ['Request changes', 'Describe what to change, add, or fix. Be specific — the factory will rebuild and bring you a new preview.'],
    answer: ['Answer the questions', 'Answer the planner\'s questions below. Short answers are fine.'],
  }[action];
  $('#dlg-title').textContent = copy[0]; $('#dlg-sub').textContent = copy[1];
  $('#dlg-text').value = ''; $('#dlg-err').hidden = true;
  const dlg = $('#dlg'); dlg.showModal(); $('#dlg-text').focus();
  $('#dlg-cancel').onclick = () => dlg.close();
  $('#dlg-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const text = $('#dlg-text').value.trim();
    if (!text) { $('#dlg-err').hidden = false; $('#dlg-err').textContent = 'Please write something first.'; return; }
    $('#dlg-ok').disabled = true;
    try { await api('/api/project', { method: 'POST', body: { n, action: 'revise', message: text } }); dlg.close(); viewProject(n); }
    catch (e) { $('#dlg-err').hidden = false; $('#dlg-err').textContent = e.message; }
    finally { $('#dlg-ok').disabled = false; }
  };
}

async function send(n, action, message, btn) {
  btn.disabled = true;
  try { await api('/api/project', { method: 'POST', body: { n, action, message } }); await viewProject(n); }
  catch (e) { alert(e.message); btn.disabled = false; }
}

function route() {
  clearTimeout(timer);
  const h = location.hash || '#/';
  if (h === '#/login') return viewLogin();
  if (h === '#/new') return viewNew();
  const m = /^#\/p\/(\d+)$/.exec(h);
  if (m) return viewProject(Number(m[1]));
  return viewHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
